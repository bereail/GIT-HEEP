# Sitio de nginx como proxy reverso delante de gunicorn. Ajustar
# server_name y las rutas antes de instalarlo.
#
# Instalación:
#   sudo cp deploy/nginx-centro-aprendizaje.conf /etc/nginx/sites-available/centro-aprendizaje
#   sudo ln -s /etc/nginx/sites-available/centro-aprendizaje /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Para HTTPS, correr certbot después de que el sitio ya responda por HTTP:
#   sudo certbot --nginx -d tu-dominio.gob.ar

server {
    listen 80;
    server_name tu-dominio.gob.ar;

    client_max_body_size 10M;  # un poco más que MAX_CONTENT_LENGTH (8 MB) de la app

    location /static/ {
        alias /opt/centro-aprendizaje/centroAprendizaje/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
